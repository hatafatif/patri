<!-- @dsCard group="Screens" height=900 width=1440 page -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=Noto+Nastaliq+Urdu:wght@600;700&display=swap">
<div id="root" style="display:grid;background:var(--ground);inline-size:max-content"></div>
<script>
  // Self-contained: no globals; the root is the element just before this script.
  (function () {
    var root = (document.currentScript && document.currentScript.previousElementSibling) || document.getElementById('root');
    var P = window.Patri;
    var unbind = function () {};
    var frame = 'position:relative;box-sizing:border-box;inline-size:1440px;block-size:900px;overflow:hidden;border:var(--border-thin) solid var(--line)';
    function setLang(lang) { var h = document.documentElement; h.lang = lang; h.dir = lang === 'ur' ? 'rtl' : 'ltr'; }
    function render() {
      unbind();
      // The sidebar's AppBar holds the language switch, so there is no preview toolbar.
      root.innerHTML = '<div style="' + frame + '">' + P.screens.TrainScreen(P.samples.train, { layout: 'web' }) + '</div>';
      // AppBar shows brand/patri-logo.svg relative to the page; the library serves the logo from its assets.
      root.querySelectorAll('.p-appbar__logo').forEach(function (img) { img.src = '/_blob/24c020f13cff6319d15f617e8824b35f'; });
      unbind = P.screens.bindScreen(root, { data: P.samples.train, onLang: function (next) { setLang(next); render(); } });
    }
    // Links in the screen are placeholders: keep the preview where it is.
    root.addEventListener('click', function (e) { if (e.target.closest && e.target.closest('a[href^="#"]')) e.preventDefault(); });
    render();
  })();
</script>
