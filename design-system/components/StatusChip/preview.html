<!-- @dsCard group="Train & station" height=240 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap">
<div id="root" style="display:grid;gap:12px;padding:16px;background:var(--ground)"></div>
<script>
  // Self-contained: no globals; the root is the element just before this script.
  (function () {
    var root = (document.currentScript && document.currentScript.previousElementSibling) || document.getElementById('root');
    const { StatusChip: C, StatusStrip: S } = window.Patri;
    const row = html => '<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">' + html + '</div>';
    root.innerHTML =
      row(
        C({ tone: 'ontime', text: 'On time' }) + C({ tone: 'late', text: '30 min late' }) +
        C({ tone: 'early', text: '5 min early' }) + C({ tone: 'nogps', text: 'No GPS' }) +
        C({ tone: 'neutral', text: 'Updated 1 min ago' })
      ) +
      row(C({ tone: 'ontime', text: 'On time', dot: true }) + C({ tone: 'late', text: '30 min late', dot: true })) +
      S({ running: { text: 'Running · 105 km/h' }, delay: { tone: 'late', text: '30 min late' }, updated: 'Updated 1 min ago' }) +
      S({ running: { text: 'Running · 98 km/h' }, delay: { tone: 'ontime', text: 'On time' } }) +
      S({ running: { text: 'Running · 112 km/h' }, delay: { tone: 'early', text: '5 min early' } });
  })();
</script>
