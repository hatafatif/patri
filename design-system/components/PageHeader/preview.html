<!-- @dsCard group="Shell" height=450 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=Noto+Nastaliq+Urdu:wght@600;700&display=swap">
<div id="root" style="display:grid;gap:24px;padding:16px;background:var(--ground);max-width:390px"></div>
<script>
  // Self-contained: no globals; the root is the element just before this script.
  (function () {
    var root = (document.currentScript && document.currentScript.previousElementSibling) || document.getElementById('root');
    const P = window.Patri;
    const row = (label, html) => '<div><div style="font:var(--t-label);letter-spacing:var(--t-label-tracking);text-transform:uppercase;color:var(--ink-muted);margin-block-end:4px">' + label + '</div>' + html + '</div>';
    root.innerHTML =
      row('Train', P.PageHeader({
        leading: { badge: { number: 28, direction: 'dn' } },
        title: 'Shalimar Express', titleUr: 'شالیمار ایکسپریس', subtitle: 'Lahore Jn → Karachi Cantt',
        actions: [{ kind: 'follow', followed: true, name: 'Shalimar Express' }, { kind: 'share', label: 'Share' }],
      })) +
      row('Station', P.PageHeader({
        leading: { icon: 'pin' },
        title: 'Multan Cantt', titleUr: 'ملتان کینٹ', subtitle: 'Multan',
        actions: [{ kind: 'follow', followed: false, name: 'Multan Cantt', label: { off: 'Save Multan Cantt', on: 'Saved' } }, { kind: 'share', label: 'Share' }],
      })) +
      row('All stops', P.PageHeader({
        title: 'All 16 stops', subtitle: '28 DN Shalimar Express · Lahore Jn → Karachi Cantt',
        actions: [{ kind: 'back', href: '#', label: 'Back' }],
      }));
    P.bindPageHeader(root, {});
  })();
</script>
