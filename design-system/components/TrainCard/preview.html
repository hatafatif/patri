      C({ href: '#', badge: { number: 28, direction: 'dn' }, name: 'Shalimar Express', position: 'Sahiwal → Multan Cantt',

      C({ href: '#', badge: { number: 108, direction: 'up' }, name: 'Karakoram Express', position: 'Khanewal Jn → Bahawalpur',
          yourStop: { name: 'Bahawalpur', time: '3:45 PM' }, status: { tone: 'early', text: '5 min early' } });
  })();
</script>
