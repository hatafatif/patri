<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=Noto+Nastaliq+Urdu:wght@600;700&display=swap">
<div id="root" style="display:grid;gap:12px;padding:16px;background:var(--ground)"></div>
<script>
  // Self-contained: no globals; the root is the element just before this script.
  (function () {
    var root = (document.currentScript && document.currentScript.previousElementSibling) || document.getElementById('root');
    const name = 'Shalimar Express';
    root.innerHTML =
      '<div style="display:flex;gap:8px;align-items:center">' +
        window.Patri.FollowButton({ followed: false, name }) +
        window.Patri.FollowButton({ followed: true, name }) +
      '</div>' +
      '<div style="display:flex;gap:8px;align-items:center">' +
        window.Patri.FollowButton({ followed: false, name: 'Multan Cantt', label: { off: 'Save Multan Cantt', on: 'Saved' } }) +
        '<span style="font:var(--t-caption);color:var(--ink-muted)">Custom label: Save Multan Cantt / Saved</span>' +
      '</div>' +
      '<div style="font:var(--t-caption);color:var(--ink-muted)">Click a star to toggle it.</div>';
    window.Patri.bindFollowButton(root, { onToggle: () => {} });
  })();
</script>
