<!-- @dsCard group="Inputs" height=150 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=Noto+Nastaliq+Urdu:wght@600;700&display=swap">
<div id="root" style="display:grid;gap:12px;padding:16px;background:var(--ground)"></div>
<script>
  // Self-contained: no globals; the root is the element just before this script.
  (function () {
    var root = (document.currentScript && document.currentScript.previousElementSibling) || document.getElementById('root');
    var P = window.Patri;
    var row = function (items) { return '<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">' + items.join('') + '</div>'; };
    root.innerHTML = [
      row([
        P.IconButton({ icon: 'swap', label: 'Swap From and To' }),
        P.IconButton({ icon: 'share', label: 'Share Shalimar Express' }),
        P.IconButton({ icon: 'back', label: 'Back', href: '#' }),
        P.IconButton({ icon: 'close', label: 'Close' }),
      ]),
      row([
        P.IconButton({ icon: 'swap', label: 'Swap From and To', variant: 'outline' }),
        P.IconButton({ icon: 'plus', label: 'Zoom in', variant: 'float' }),
        P.IconButton({ icon: 'minus', label: 'Zoom out', variant: 'float' }),
        P.IconButton({ icon: 'layers', label: 'Map style', variant: 'float' }),
        P.IconButton({ icon: 'starFilled', label: 'Follow Shalimar Express', pressed: true }),
      ]),
    ].join('');
  })();
</script>
