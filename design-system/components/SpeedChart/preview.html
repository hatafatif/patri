<!-- @dsCard group="Train & station" height=580 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap">
<div id="root" style="display:grid;gap:12px;padding:16px;background:var(--ground);max-width:440px"></div>
<script>
  // Self-contained: no globals; the root is the element just before this script.
  (function () {
    var root = (document.currentScript && document.currentScript.previousElementSibling) || document.getElementById('root');
    // 28 DN Shalimar Express: left Lahore Jn at 7:10 AM PKT, stopped at Raiwind, Okara and Sahiwal, now about 11:30 AM.
    var d = new Date(Date.now() + 5 * 3600e3);
    var start = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()) - 5 * 3600e3 + (7 * 60 + 10) * 60000;
    var STOPS = [[42, 3, 'Raiwind Jn'], [145, 3, 'Okara'], [232, 3, 'Sahiwal']];
    var points = [];
    for (var m = 0; m <= 260; m++) {
      var dist = m;
      var inStop = false;
      STOPS.forEach(function (s) { dist = Math.min(dist, Math.abs(m - s[0]), Math.abs(m - s[0] - s[1])); if (m >= s[0] && m <= s[0] + s[1]) inStop = true; });
      var cruise = Math.min(110, 96 + 11 * Math.sin(m / 9) + 5 * Math.sin(m / 3.1));
      points.push([start + m * 60000, inStop ? 0 : Math.round(cruise * Math.min(1, dist / 9))]);
    }
    var stops = STOPS.map(function (s) { return { ms: start + (s[0] + 1) * 60000, name: s[2] }; });
    var box = function (html) { return '<div style="padding:12px;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--surface)">' + html + '</div>'; };
    root.innerHTML = box(window.Patri.SpeedChart({ points: points, stops: stops, now: points[points.length - 1][0] }))
      + box(window.Patri.SpeedChart({ points: points, stops: stops, now: points[points.length - 1][0], title: 'Speed so far', stats: false }))
      + box(window.Patri.SpeedChart({ points: [], stops: [] }));
    window.Patri.bindSpeedChart(root, points);
  })();
</script>
