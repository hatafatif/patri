<!-- @dsCard group="Train & station" height=250 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=Noto+Nastaliq+Urdu:wght@600;700&display=swap">
<div id="root" style="display:grid;gap:12px;padding:16px;background:var(--ground)"></div>
<script>
  // Self-contained: no globals; the root is the element just before this script.
  (function () {
    var root = (document.currentScript && document.currentScript.previousElementSibling) || document.getElementById('root');
    const B = window.Patri.TrainBadge;
    const row = html => '<div style="display:flex;gap:12px;align-items:center">' + html + '</div>';
    root.innerHTML =
      row(B({ number: 28, direction: 'dn', size: 'sm' }) + B({ number: 28, direction: 'dn', size: 'md' }) + B({ number: 28, direction: 'dn', size: 'lg' })) +
      row(B({ number: 115, direction: 'up', size: 'sm' }) + B({ number: 115, direction: 'up', size: 'md' }) + B({ number: 115, direction: 'up', size: 'lg' })) +
      row(B({ number: 108, direction: 'up', size: 'sm' }) + B({ number: 8, direction: 'dn', size: 'md' }));
  })();
</script>
