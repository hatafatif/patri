<!-- @dsCard group="Train & station" height=2100 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap">
<div id="root" style="display:grid;gap:12px;padding:16px;background:var(--ground);max-width:440px"></div>
<script>
  // Self-contained: no globals; the root is the element just before this script.
  (function () {
    var root = (document.currentScript && document.currentScript.previousElementSibling) || document.getElementById('root');
    var rows = [
      { kind: 'passed', name: 'Lahore Jn', time: { expected: '7:10 AM' } },
      { kind: 'passed', name: 'Raiwind Jn', sub: 'Platform 2', time: { expected: '7:52 AM' } },
      { kind: 'more', name: '8 more stops', href: '#' },
      { kind: 'passed', name: 'Sahiwal', time: { expected: '11:02 AM' } },
      { kind: 'train', name: 'Train here · 27 km to Multan Cantt' },
      { kind: 'next', name: 'Khanewal Jn', sub: 'Next stop', time: { expected: '~12:40 PM', scheduled: '12:10 PM' }, countdown: 'in 20 min', href: '#' },
      { kind: 'yourstop', name: 'Multan Cantt', sub: 'Your stop', time: { expected: '~1:20 PM', scheduled: '12:50 PM' }, countdown: 'in 1 h', change: true },
      { kind: 'stop', name: 'Bahawalpur', sub: 'Stops 2 min', time: { expected: '~3:35 PM' }, href: '#' },
      { kind: 'final', name: 'Karachi Cantt', sub: 'Last stop', time: { expected: '~6:05 AM' } }
    ];
    var cardRows = [
      { kind: 'passed', label: 'Started from', name: 'Karachi Cantt', time: { expected: 'Yesterday 10:00 PM' } },
      { kind: 'passed', label: 'Just passed', name: 'Khanewal Jn', time: { expected: 'Today 11:45 AM' } },
      { kind: 'next', label: 'Next stop', name: 'Lahore Jn', sub: '240 km away · 104 km/h now', time: { expected: 'Today ~4:48 PM' }, countdown: 'in 3 h 4 min' },
      { kind: 'more', name: '2 more stops', href: '#' },
      { kind: 'final', label: 'Last stop', name: 'Margala', sub: 'Planned 9:10 PM', time: { expected: 'Today ~10:23 PM' } }
    ];
    var label = function (s) { return '<div class="t-label" style="margin-top:4px">' + s + '</div>'; };
    var box = function (id, html) { return '<div id="' + id + '" style="border:1px solid var(--line);border-radius:var(--radius-md);background:var(--surface);overflow:hidden">' + html + '</div>'; };
    root.innerHTML = label('Card (Right now)') + box('card', window.Patri.StopTimeline({ rows: cardRows, mode: 'card' }))
      + label('Compact') + box('compact', window.Patri.StopTimeline({ rows: rows, mode: 'compact' }))
      + label('Full (All stops)') + box('full', window.Patri.StopTimeline({ rows: rows, mode: 'full' }))
      + label('Full, with legend') + box('legend', window.Patri.StopTimeline({ rows: rows, mode: 'full', legend: true }));
    window.Patri.bindStopTimeline(root.querySelector('#compact'), { onChangeStop: function () {} });
  })();
</script>
