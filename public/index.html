<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#01411c">
<meta name="description" content="Pakistan Railways trains, live: where your train is, how late it is, and when it reaches your stop.">
<title>Patri · پٹڑی</title>
<link rel="icon" href="brand/patri-favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<!-- The full Nastaliq face, always declared. Browsers download a font file only when Urdu glyphs actually render,
     so English-only pages pay nothing for it. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap">
<script>
  // Set the language before the first paint, so an Urdu reader never sees the page flip.
  try {
    if (localStorage.getItem('lang') === 'ur') {
      document.documentElement.lang = 'ur';
      document.documentElement.dir = 'rtl';
    }
  } catch (e) {}
</script>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/screens.css">
<style>
  /* The app root: one screen fills the viewport. */
  html, body { margin: 0; block-size: 100%; background: var(--ground); }
  .p-app { position: fixed; inset: 0; overflow: hidden; color: var(--ink); font: var(--t-body); }
</style>
<script defer src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script type="module" src="js/app.js"></script>
</head>
<body>
<div id="app" class="p-app"></div>
<noscript>Patri needs JavaScript to show live trains.</noscript>
</body>
</html>
